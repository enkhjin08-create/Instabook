<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Захиалгын жагсаалт — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#B4536B; --rose-deep:#7E2F42; --gold:#C9A65F; --sage:#8A9A7E;
    --paper:#FBF7F0; --paper-dim:#F1E9DD; --ink:#2B2420; --ink-soft:#6b5f56;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper-dim);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .topbar{padding:18px 24px;background:var(--paper);border-bottom:1px solid #e6dcc9;}
  .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:var(--rose-deep);}
  .brand span{color:var(--gold);font-style:italic;font-family:'Cormorant Garamond',serif;font-weight:500;}

  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:20px;}
  .login-box{background:var(--paper);border-radius:14px;padding:30px;max-width:320px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center;}
  .login-box h2{font-family:'Playfair Display',serif;color:var(--rose-deep);margin:0 0 16px;}
  .login-box input{width:100%;padding:12px;border:1px solid #e6dcc9;border-radius:8px;font-size:15px;text-align:center;letter-spacing:3px;margin-bottom:12px;}
  .btn{background:var(--rose-deep);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;width:100%;}
  .btn:hover{background:var(--rose);}
  .btn.ghost{background:transparent;border:1.5px solid var(--rose-deep);color:var(--rose-deep);width:auto;padding:8px 16px;font-size:12.5px;}

  .content{padding:24px;max-width:900px;margin:0 auto;}
  .order-card{
    background:var(--paper);border-radius:12px;padding:18px 20px;margin-bottom:14px;
    border:1px solid #e6dcc9;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .order-info h4{margin:0 0 4px;font-size:15px;color:var(--rose-deep);}
  .order-info p{margin:2px 0;font-size:13px;color:var(--ink-soft);}
  .status-pill{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;
  }
  .status-pill.pending{background:#F3ECDF;color:var(--gold);}
  .status-pill.done{background:#e5ede0;color:var(--sage);}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">ZuvkhunTuund <span>Захиалгын жагсаалт</span></div>
</div>

<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <h2>Admin нэвтрэх</h2>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="PIN код" maxlength="10" />
    <button class="btn" id="loginBtn">Нэвтрэх</button>
  </div>
</div>

<div id="content" class="content" style="display:none;">
  <div class="refresh-row">
    <button class="btn ghost" id="refreshOrdersBtn">🔄 Дахин ачаалах</button>
    <span style="font-size:12px;color:var(--ink-soft);" id="orderCount"></span>
  </div>
  <div id="ordersList"></div>
</div>

<script>
let PIN = sessionStorage.getItem('admin_pin') || '';

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString('mn-MN', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

async function loadOrders(){
  const res = await fetch(`/.netlify/functions/order-list?pin=${encodeURIComponent(PIN)}`);
  if(!res.ok){
    if(res.status === 401){
      sessionStorage.removeItem('admin_pin');
      document.getElementById('loginWrap').style.display = 'flex';
      document.getElementById('content').style.display = 'none';
      alert('PIN буруу байна');
    }
    return;
  }
  const data = await res.json();
  const orders = data.orders || [];
  document.getElementById('orderCount').textContent = `${orders.length} захиалга`;
  const list = document.getElementById('ordersList');
  if(orders.length === 0){
    list.innerHTML = `<div class="empty">Одоогоор захиалга алга.</div>`;
    return;
  }
  list.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-info">
        <h4>${o.customerName || '(нэргүй)'} — ${o.phone}</h4>
        <p>${o.address || ''}</p>
        <p>${fmtDate(o.createdAt)} · ${o.pageCount} хуудас · <span class="status-pill ${o.status}">${o.status === 'done' ? 'Дууссан' : 'Хүлээгдэж буй'}</span></p>
      </div>
      <a class="btn" style="width:auto;text-decoration:none;" href="/?orderId=${encodeURIComponent(o.id)}&pin=${encodeURIComponent(PIN)}" target="_blank">Нээх →</a>
    </div>
  `).join('');
}

document.getElementById('loginBtn').addEventListener('click', ()=>{
  PIN = document.getElementById('pinInput').value.trim();
  if(!PIN) return;
  sessionStorage.setItem('admin_pin', PIN);
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  loadOrders();
});

document.getElementById('refreshOrdersBtn').addEventListener('click', loadOrders);

if(PIN){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  loadOrders();
}
</script>
</body>
</html>
